<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- The brand goes first: people find this site by searching its name. -->
    <title>Banana Education Consultancy — Study Abroad Counselling in Kathmandu</title>
    <meta name="description" content="Banana Education Consultancy offers free counselling for students applying to universities in Australia, the USA, the UK, South Korea and Europe, plus IELTS, PTE and TOPIK classes." />

    <!-- SVG scales to any size and stays sharp; the .ico is the fallback for
         older browsers and the bookmarks bar. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0B2340" />

    <!-- These consultancies market on Facebook and WhatsApp, so the shared
         link IS the advert. Without an og:image the preview is a grey box. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Banana Education" />
    <meta property="og:title" content="Banana Education Consultancy — Study Abroad Counselling in Kathmandu" />
    <meta property="og:description" content="Free counselling for students applying to universities in Australia, the USA, the UK, South Korea and Europe." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Real text before the app loads. React replaces it on start-up, but
         crawlers that don't run JavaScript (and Google's first pass, which
         does) see the business name and what it does instead of an empty div. -->
    <div id="root">
      <main class="wrap py-16">
        <h1 class="text-3xl">Banana Education Consultancy</h1>
        <p class="mt-4 max-w-prose text-lg">
          Free study abroad counselling in Kathmandu for universities in
          Australia, the USA, the UK, South Korea and Europe — applications,
          scholarships, student visas, and IELTS, PTE and TOPIK classes.
        </p>
        <ul class="mt-6">
          <li><a href="/apply">Book free counselling</a></li>
          <!--destinations-->
        </ul>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
