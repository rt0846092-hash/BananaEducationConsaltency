<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Banana Education — study abroad counselling</title>
    <meta name="description" content="Free counselling for students applying to universities in Australia, the USA, the UK, South Korea and Europe." />

    <!-- SVG scales to any size and stays sharp; the .ico is the fallback for
         older browsers and the bookmarks bar. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0B2340" />

    <!-- These consultancies market on Facebook and WhatsApp, so the shared
         link IS the advert. Without an og:image the preview is a grey box. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Banana Education — study abroad counselling" />
    <meta property="og:description" content="Free counselling for students applying to universities in Australia, the USA, the UK, South Korea and Europe." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
